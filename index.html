<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Little Stones</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height — accounts for browser chrome on mobile */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
    }
    /* On desktop, constrain to landscape phone proportions */
    @media screen and (min-width: 700px) {
      #game-container {
        max-width: 844px;
        max-height: 475px;
        margin: 0 auto;
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
      }
    }
    #rotate-prompt {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #1a1a2e;
      color: white;
      font-family: Arial, sans-serif;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      font-size: 20px;
    }
    #rotate-prompt span { font-size: 60px; margin-bottom: 20px; }
    @media screen and (orientation: portrait) and (max-width: 600px) {
      #rotate-prompt { display: flex; }
      #game-container { display: none; }
    }
  </style>
</head>
<body>
  <div id="rotate-prompt">
    <span>📱</span>
    <p>Please rotate your device to landscape mode</p>
  </div>
  <div id="game-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="src/utils/constants.js"></script>
  <script src="src/systems/gameConfig.js"></script>
  <script src="src/systems/dataManager.js"></script>
  <script src="src/systems/sessionManager.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/PreloadScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/StoryScene.js"></script>
  <script src="src/scenes/InstructionScene.js"></script>
  <script src="src/scenes/GameLoopScene.js"></script>
  <script src="src/scenes/ResultScene.js"></script>
  <script src="src/scenes/OnboardingScene.js"></script>
  <script src="src/scenes/GamePickerScene.js"></script>
  <script src="src/games/LetThereBeLightGame.js"></script>
  <script src="src/games/NoahsArkGame.js"></script>
  <script src="src/games/TowerOfBabelGame.js"></script>
  <script src="src/games/WrestleTheAngelGame.js"></script>
  <script src="src/games/WaterToWineGame.js"></script>
  <script src="src/games/RollTheStoneGame.js"></script>
  <script src="src/games/DanielLionsDenGame.js"></script>
  <script src="src/games/FieryFurnaceGame.js"></script>
  <script src="src/games/HouseOnRockGame.js"></script>
  <script src="src/games/DavidVsGoliathGame.js"></script>
  <script src="src/games/WalkAroundJerichoGame.js"></script>
  <script src="src/games/HeMustIncreaseGame.js"></script>
  <script src="src/games/LostSheepGame.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
